global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus kendini izlesin
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ChefAI API (deploy asamasinda aktif olacak)
  - job_name: "chefai-api"
    static_configs:
      - targets: ["chefai-api:8000"]
    metrics_path: /metrics
