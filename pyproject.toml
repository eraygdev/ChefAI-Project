[tool.poetry]
name = "chefai"
version = "1.0.0"
description = "ChefAI - Food recognition + allergy warning system"
authors = ["Eray <eray@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
torch = {version = "2.4.1", source = "pytorch"}
torchvision = {version = "0.19.1", source = "pytorch"}
numpy = "^2.0"
pillow = "^12.0"
tqdm = "^4.70"
requests = "^2.34"
icrawler = "^0.6.10"
fastapi = "^0.115"
uvicorn = {version = "^0.34", extras = ["standard"]}
python-multipart = "^0.0.20"
pydantic = "^2.10"
mlflow = "^2.20"
optuna = "^4.0"
shap = "^0.46"
scikit-learn = "^1.5"
matplotlib = "^3.9"
seaborn = "^0.13"
pandas = "^2.2"
dvc = "^3.55"
great-expectations = "^1.3"
evidently = "^0.6"
prometheus-fastapi-instrumentator = "^7.0"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
black = "^24.10"
flake8 = "^7.1"
isort = "^5.13"
mypy = "^1.13"
pre-commit = "^4.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "venv", "mlruns"]
