[project]
name = "chefai"
version = "1.0.0"
description = "ChefAI - Food recognition + allergy warning system"
authors = [{name = "Eray", email = "eray@example.com"}]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Deep Learning
    "torch==2.4.1",
    "torchvision==0.19.1",
    "timm>=1.0.30,<2.0.0",
    "numpy>=1.26.4,<2.0",
    "pillow>=10.4.0,<11.0",

    # Data pipeline
    "icrawler>=0.6.10",
    "requests>=2.34",
    "tqdm>=4.70",

    # MLOps - Experiment tracking
    "mlflow>=2.20",
    "optuna>=4.0",
    "shap>=0.46",

    # Data versioning & validation
    "dvc>=3.55",
    "great-expectations>=1.3",

    # Monitoring
    "evidently>=0.6",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.21",

    # API & Deployment
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "gunicorn>=23.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "python-dotenv>=1.0",

    # Data science
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "opencv-python-headless<4.11",
    "boto3 (>=1.43.121,<2.0.0)",
]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.7"
mypy = "^1.13"
pre-commit = "^4.0"
ipykernel = "^6.29"
jupyter = "^1.1"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------
# RUFF - Linting + Formatting
# ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "__pycache__", "venv", ".venv", "mlruns", "data", "notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long (line-length handles it)
    "B008",  # do not perform function call in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------
# MYPY
# ---------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "data", "notebooks", "mlruns"]

# ---------------------------------------------------------------
# PYTEST
# ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=term-missing"
