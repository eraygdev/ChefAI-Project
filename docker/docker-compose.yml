services:
  # ============================================================
  # MLOPS STACK - PDF sayfa 5
  # ============================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.0
    container_name: chefai-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install --no-cache-dir psycopg2-binary boto3 &&
        exec mlflow server \
          --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow \
          --default-artifact-root s3://mlflow/ \
          --host 0.0.0.0 \
          --port 5000
    depends_on:
      - postgres
      - minio
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: chefai-minio
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: chefai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # ============================================================
  # API + MONITORING (profil ile ayrildi; setup'ta kalkmaz)
  # ============================================================
  chefai-api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: chefai-api:latest
    container_name: chefai-api
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # ... geri kalan aynı

  prometheus:
    profiles: ["monitor"]
    image: prom/prometheus:latest
    container_name: chefai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    profiles: ["monitor"]
    image: grafana/grafana:latest
    container_name: chefai-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  minio-data:
  postgres-data:
  prometheus-data:
  grafana-data:
